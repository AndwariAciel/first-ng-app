<div class="overview-wrapper">
    <div class="cards-panel">
        <div class="cards-header">
            <h2 class="set-title">{{ setData().name }}</h2>
        </div>
        @if (cardService.loading()) {
            <div class="loading-overlay">
                <div class="spinner"></div>
            </div>
        } @else {
            <div class="cards-grid">
                @for (card of cardData(); track $index) {
                    <div class="card-tile">
                        <span class="card-name">{{ card.name }}</span>
                        <img [src]="card.pictureUri" [alt]="card.name" class="card-image" />
                    </div>
                }
            </div>
        }
    </div>
    <div class="detail-panel">
        @if (setData().code) {
            <div class="set-detail">
                <div class="set-detail-header">
                    <div class="set-icon-wrapper">
                        <img [src]="setData().icon_svg_uri" [alt]="setData().name" class="set-icon" />
                    </div>
                    <div class="set-title-group">
                        <h1 class="set-name">{{ setData().name }}</h1>
                        <div class="set-meta">
                            <span class="status-dot"
                                [class.green]="setData().released"
                                [class.red]="!setData().released">
                            </span>
                            <span class="set-code">{{ setData().code.toUpperCase() }}</span>
                            <span class="set-type">{{ setData().set_type }}</span>
                        </div>
                    </div>
                </div>

                <div class="set-stats">
                    <div class="stat-block">
                        <span class="stat-label">Cards</span>
                        <span class="stat-value">{{ setData().cardsReady }} / {{ setData().cards }}</span>
                    </div>
                </div>

                <button class="update-btn" type="button" title="Update" (click)="setService.updateSet(setData())">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
            </div>
        }
    </div>
</div>
